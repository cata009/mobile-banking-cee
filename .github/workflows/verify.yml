name: verify

# The repo already defines the full quality gate as `npm run verify`
# (typecheck -> lint -> test -> audits -> build). This runs it on every push and
# pull request so regressions surface here instead of in someone's working tree.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The asset audit reads canonical bytes through `git hash-object`, so it
      # needs a real working tree - which the checkout above already provides.
      - name: Run the full gate
        run: npm run verify

      - name: Validate declared agent ownership
        if: github.event_name == 'pull_request' && hashFiles('.agent-task.json') != ''
        env:
          TASK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TASK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$TASK_BASE_SHA" "$TASK_HEAD_SHA"
          npm run agent:scope -- --task .agent-task.json --base "$TASK_BASE_SHA" --head "$TASK_HEAD_SHA"
