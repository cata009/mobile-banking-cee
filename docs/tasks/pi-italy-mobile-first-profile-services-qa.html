<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Mobile First services visual QA</title>
    <style>
      body { margin: 0; padding: 24px; background: #e5e5e5; }
      #controls { display: flex; justify-content: center; gap: 16px; margin-bottom: 24px; }
      #controls button { padding: 8px 16px; border-radius: 8px; background: white; border: 1px solid #ccc; }
      #device { position: relative; width: 393px; height: 852px; margin: auto; border-radius: 40px; background: white; overflow: hidden; transform: scale(.82); transform-origin: top center; margin-bottom: -153px; }
      #service-root { width: 100%; height: 100%; }
      #status { position: absolute; z-index: 50; inset: 0 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 16px; font: 600 15px/20px system-ui; pointer-events: none; }
      #status img { display: block; max-width: none; }
      #status.dark { color: white; }
      #status.dark img { filter: brightness(0) invert(1); }
    </style>
  </head>
  <body>
    <nav id="controls" aria-label="Visual QA views">
      <button data-entry="support">Support</button>
      <button data-entry="documents">Documents</button>
      <button data-entry="bank">Bank</button>
      <button data-entry="appointments">Appointments</button>
    </nav>
    <div id="device">
      <div id="service-root"></div>
      <div id="status"><span>9:41</span><img src="/src/assets/mobile-first/it/profile/services/context0-imgFrame1.svg" alt="" /></div>
    </div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import '/src/styles/index.css'
      import Services from '/src/experiences/pi/it/mobile-first/MobileFirstProfileServices.tsx'
      import { ProfileChromeContext } from '/src/experiences/pi/it/mobile-first/MobileFirstProfilePrimitives.tsx'
      const root = createRoot(document.getElementById('service-root'))
      const setChrome = variant => document.getElementById('status').classList.toggle('dark', variant === 'dark')
      let view = new URLSearchParams(location.search).get('entry') || 'support'
      function show(entry) {
        view = entry
        history.replaceState(null, '', `?entry=${entry}`)
        root.render(React.createElement(ProfileChromeContext.Provider, { value: setChrome }, React.createElement(Services, { key: entry, entry, onBack: () => show('support'), onClose: () => show(view), onNavigate: target => { if (['support', 'bank', 'appointments', 'documents', 'communications'].includes(target)) show(target) } })))
      }
      document.querySelectorAll('[data-entry]').forEach(button => button.addEventListener('click', () => show(button.dataset.entry)))
      show(view)
    </script>
  </body>
</html>
